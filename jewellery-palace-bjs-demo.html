<title>Jewellery Palace BJS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Cinzel:wght@500;600;700&family=Jost:wght@300;400;500;600&display=swap">
<style>
/* Layout: espresso bands framing a cream editorial grid; display type does the
   heavy lifting, brass appears only as rules, seals and one word at a time. */
:root{
  --cream:#FAF6F0; --paper:#FFFDF9; --sand:#F1E9DC; --dune:#E8DCCA;
  --espresso:#1C1714; --coal:#3A322A;
  --brass:#B08D4F; --brass-d:#8E6E37; --brass-l:#D8BD86; --brass-wash:#F6EEDE;
  --ink:#231D18; --soft:#6B6055; --faint:#9C9086;
  --line:#E4D9C7; --line-2:#F0E8DA;
  --rose:#8E4A4E; --ok:#4A6B51; --amber:#A9701F;
  --display:'Playfair Display',Georgia,'Times New Roman',serif;
  --wordmark:'Cinzel','Playfair Display',Georgia,serif;
  --body:'Jost',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --shadow:0 2px 4px rgba(28,23,20,.03),0 18px 44px -24px rgba(28,23,20,.30);
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.62;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.005em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
.wrap{max-width:1200px;margin-inline:auto;padding-inline:28px}
.lbl{font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;font-weight:500}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- sticky stack ---------- */
.stack{position:sticky;top:env(safe-area-inset-top,0px);z-index:60}
.protobar{background:var(--espresso);color:#D8CCBC}
.protobar .wrap{display:flex;align-items:center;gap:16px;min-height:38px;flex-wrap:wrap;padding-block:7px}
.protobar .lbl{font-size:9.5px;color:#9A8D7E}
.protobar b{color:var(--brass-l);font-weight:500}
.sp{flex:1}
.modeswitch{display:flex;border:1px solid #3B3229}
.modeswitch button{background:none;border:0;padding:5px 13px;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;color:#9A8D7E;cursor:pointer}
.modeswitch button[aria-pressed=true]{background:var(--brass);color:#1C1714}

header.store{background:rgba(250,246,240,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
header.store .wrap{display:flex;align-items:center;gap:26px;min-height:74px;padding-block:12px}
.brand{display:flex;align-items:center;gap:13px;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.brand .seal{width:40px;height:40px;flex:none;border-radius:50%;background:var(--espresso);color:var(--brass-l);display:grid;place-items:center;font-family:var(--wordmark);font-weight:600;font-size:16px;letter-spacing:.04em}
.brand .nm{font-family:var(--wordmark);font-weight:600;font-size:19px;line-height:1.05;display:block;letter-spacing:.07em;text-transform:uppercase}
.brand .sub{font-size:8.5px;letter-spacing:.34em;color:var(--faint);text-transform:uppercase;font-weight:500;display:block;margin-top:5px}
nav.main{display:flex;gap:28px}
nav.main button{background:none;border:0;padding:8px 0;cursor:pointer;font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;color:var(--soft);position:relative}
nav.main button::after{content:'';position:absolute;left:0;right:0;bottom:2px;height:1px;background:var(--brass);transform:scaleX(0);transition:transform .25s ease}
nav.main button:hover::after,nav.main button[data-on=true]::after{transform:scaleX(1)}
nav.main button[data-on=true]{color:var(--ink)}
.hact{display:flex;align-items:center;gap:4px}
.iconbtn{background:none;border:0;padding:8px;cursor:pointer;display:flex;align-items:center;color:var(--soft);position:relative}
.iconbtn:hover{color:var(--ink)}
.iconbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.3}
.cartcount{position:absolute;top:0;right:-2px;background:var(--brass);color:#fff;font-size:9px;font-weight:600;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px;line-height:1}
.burger{display:none}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:1px solid var(--espresso);background:var(--espresso);color:var(--cream);padding:13px 26px;cursor:pointer;font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;transition:background .2s,color .2s,border-color .2s}
.btn:hover{background:var(--brass-d);border-color:var(--brass-d);color:#fff}
.btn.ghost{background:none;color:var(--ink);border-color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--cream)}
.btn.brass{background:var(--brass);border-color:var(--brass);color:#fff}
.btn.brass:hover{background:var(--brass-d);border-color:var(--brass-d)}
.btn.onDark{border-color:var(--brass-l);background:none;color:var(--brass-l)}
.btn.onDark:hover{background:var(--brass-l);color:var(--espresso)}
.btn.sm{padding:9px 16px;font-size:10px;letter-spacing:.16em}
.btn:disabled{opacity:.38;cursor:not-allowed}
.link{background:none;border:0;padding:0 0 2px;cursor:pointer;color:var(--brass-d);border-bottom:1px solid currentColor;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}

/* ---------- artwork ---------- */
.media{position:relative;aspect-ratio:1;max-width:100%;overflow:hidden}
.media svg{width:100%;height:100%;display:block;transition:transform .7s cubic-bezier(.2,.7,.25,1)}
.media .tag{position:absolute;top:14px;left:14px;background:var(--espresso);color:var(--brass-l);font-size:8.5px;letter-spacing:.2em;padding:5px 10px;text-transform:uppercase;font-weight:500}
.media .tag.rose{background:var(--rose);color:#fff}

/* ---------- product card ---------- */
.grid{display:grid;gap:34px 26px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.pcard{background:none;border:0;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;min-width:0}
.pcard .media{border:1px solid var(--line-2)}
.pcard:hover .media svg{transform:scale(1.07)}
.pcard .nm{font-family:var(--display);font-weight:600;font-size:18.5px;line-height:1.28;margin-top:16px}
.pcard .meta{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin-top:7px;font-weight:500}
.pcard .pr{font-size:15px;margin-top:11px}

/* ---------- sections ---------- */
.band{padding-block:88px}
.band.tight{padding-block:56px}
.band.sand{background:var(--sand)}
.band.dark{background:var(--espresso);color:#A29586}
.band.dark h2,.band.dark h3{color:#F4EBDE}
.shead{margin-bottom:44px;display:flex;align-items:flex-end;justify-content:space-between;gap:26px;flex-wrap:wrap}
.shead h2{font-size:clamp(28px,4vw,42px);line-height:1.08}
.shead .lbl{color:var(--brass-d);display:block;margin-bottom:16px}
.band.dark .shead .lbl{color:var(--brass-l)}
.shead p{color:var(--soft);font-size:14.5px;max-width:50ch;margin-top:12px}
.band.dark .shead p{color:#A29586}

/* hero */
.hero{background:var(--espresso);color:#A89B8C;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;inset:0;background:radial-gradient(70% 90% at 78% 30%,rgba(176,141,79,.16),transparent 62%);pointer-events:none}
.hero .wrap{display:grid;grid-template-columns:1fr .86fr;gap:64px;align-items:center;padding-block:84px;position:relative;z-index:1}
.hero .lbl{color:var(--brass-l);display:block;margin-bottom:22px}
.hero h1{font-size:clamp(36px,5.6vw,66px);line-height:1.06;color:#F6EEE2;letter-spacing:-.015em;font-weight:600}
.hero h1 em{font-style:italic;color:var(--brass-l)}
.hero .lede{color:#A89B8C;font-size:16px;max-width:42ch;margin-top:24px}
.hero .cta{display:flex;gap:14px;margin-top:36px;flex-wrap:wrap}
.hero .assure{display:flex;gap:40px;margin-top:52px;padding-top:26px;border-top:1px solid #3B3229;flex-wrap:wrap}
.hero .assure b{font-family:var(--display);font-weight:600;font-size:23px;color:var(--brass-l);display:block;line-height:1}
.hero .assure span{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:#877B6D;display:block;margin-top:8px;font-weight:500}
.heroart{position:relative}
.heroart .media{border:1px solid #453A30}
.heroart .plate{position:absolute;left:-28px;bottom:32px;background:var(--cream);color:var(--ink);padding:18px 24px;box-shadow:0 20px 50px -24px rgba(0,0,0,.6)}
.heroart .plate b{font-family:var(--display);font-weight:600;font-size:20px;display:block;line-height:1.15}
.heroart .plate span{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);font-weight:500}

/* category row */
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.ccard{background:none;border:0;padding:0;cursor:pointer;text-align:left;min-width:0}
.ccard .media{aspect-ratio:5/4;border:1px solid var(--line-2)}
.ccard:hover .media svg{transform:scale(1.06)}
.ccard .cap{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-top:14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.ccard .cap b{font-family:var(--display);font-size:19px;font-weight:600}
.ccard .cap span{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:500;white-space:nowrap}
.ccard p{font-size:13px;color:var(--soft);margin-top:10px}

/* editorial split */
.split{display:grid;grid-template-columns:1fr 1fr;align-items:stretch;border:1px solid #3B3229}
.split .art{position:relative;min-height:360px}
.split .art .media{height:100%;aspect-ratio:auto;position:absolute;inset:0}
.split .txt{padding:58px 54px}
.split .txt .lbl{color:var(--brass-l);display:block;margin-bottom:18px}
.split .txt h3{font-size:clamp(26px,3.2vw,38px);line-height:1.1}
.split .txt p{color:#A29586;margin-top:18px;font-size:14.5px;max-width:42ch}
.split .txt .btn{margin-top:34px}

/* pillars */
.pillars{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.pillars article{padding:38px 36px 6px 0}
.pillars article+article{padding-left:36px;border-left:1px solid var(--line)}
.pillars .num{font-family:var(--wordmark);font-weight:700;font-size:13px;color:var(--brass-d);letter-spacing:.24em;display:block;margin-bottom:18px}
.pillars h3{font-size:23px;margin-bottom:10px}
.pillars p{font-size:13.5px;color:var(--soft)}

/* ---------- catalogue ---------- */
.crumb{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);padding-block:26px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:500}
.crumb button{background:none;border:0;padding:0;cursor:pointer;color:var(--faint);font:inherit}
.crumb button:hover{color:var(--brass-d)}
.catwrap{display:grid;grid-template-columns:220px 1fr;gap:56px;align-items:start}
.filters{position:sticky;top:170px;display:flex;flex-direction:column;gap:30px}
.fgroup h4{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink);font-weight:600;margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.fgroup label{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13.5px;cursor:pointer;color:var(--soft)}
.fgroup label:hover{color:var(--ink)}
.fgroup input[type=checkbox]{accent-color:var(--brass);width:14px;height:14px}
.fgroup .ct{margin-left:auto;font-size:11px;color:var(--faint)}
.fgroup input[type=search]{border:0;border-bottom:1px solid var(--line);background:none;padding:9px 0;font-size:14px;width:100%}
.fgroup input[type=search]:focus{outline:none;border-color:var(--brass)}
input[type=range]{width:100%;accent-color:var(--brass)}
.catbar{display:flex;align-items:center;justify-content:space-between;gap:18px;padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:34px;flex-wrap:wrap}
.catbar .ct{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);font-weight:500}
select.sort{border:0;border-bottom:1px solid var(--line);background:none;padding:7px 0;font-size:13px;cursor:pointer}
.chips{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:26px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--paper);padding:6px 12px;font-size:10px;letter-spacing:.14em;cursor:pointer;text-transform:uppercase;font-weight:600;color:var(--soft)}
.chip:hover{border-color:var(--brass);color:var(--brass-d)}
.empty{text-align:center;padding:80px 24px;border:1px solid var(--line);background:var(--paper)}
.empty h3{font-size:24px;margin-bottom:10px}
.empty p{color:var(--soft);font-size:14px;margin-bottom:22px}

/* ---------- product detail ---------- */
.pdp{display:grid;grid-template-columns:1.05fr .95fr;gap:64px;align-items:start;padding-bottom:88px}
.pgal{display:flex;flex-direction:column;gap:12px}
.pgal .media{border:1px solid var(--line)}
.zoomwrap{cursor:zoom-in}
.zoomwrap.on svg{transform:scale(2.2)}
.zoomhint{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);text-align:center;font-weight:500}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.thumbs button{padding:0;border:1px solid var(--line);cursor:pointer;aspect-ratio:1;overflow:hidden;background:none}
.thumbs button[data-on=true]{border-color:var(--brass)}
.thumbs svg{width:100%;height:100%}
.pdp .lbl{color:var(--brass-d);display:block;margin-bottom:16px}
.pdp h1{font-size:clamp(30px,4.2vw,46px);line-height:1.08}
.pdp .price{font-size:26px;margin-top:20px;font-family:var(--display);font-weight:600}
.pdp .price small{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin-left:14px;font-family:var(--body);font-weight:600}
.pdp .desc{color:var(--soft);margin-top:22px;max-width:50ch;font-size:15px}
.specs{display:grid;grid-template-columns:repeat(2,1fr);margin-top:34px;border-top:1px solid var(--line)}
.specs div{padding:16px 20px 16px 0;border-bottom:1px solid var(--line);min-width:0}
.specs dt{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);font-weight:600;margin-bottom:6px}
.specs dd{margin:0;font-size:14.5px}
.buyrow{display:flex;gap:12px;margin-top:34px;flex-wrap:wrap}
.buyrow .btn{flex:1;min-width:180px}
.qty{display:flex;align-items:center;border:1px solid var(--ink)}
.qty button{background:none;border:0;width:42px;height:48px;cursor:pointer;font-size:17px;color:var(--soft)}
.qty button:hover{color:var(--brass-d)}
.qty span{width:34px;text-align:center;font-size:14px}
.trustrow{display:flex;gap:26px;margin-top:26px;flex-wrap:wrap}
.trustrow div{display:flex;gap:9px;align-items:center;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);font-weight:600}
.trustrow svg{width:17px;height:17px;stroke:var(--brass-d);fill:none;stroke-width:1.3;flex:none}
.acc{margin-top:38px;border-top:1px solid var(--line)}
.acc details{border-bottom:1px solid var(--line)}
.acc summary{padding:17px 0;cursor:pointer;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:'+';color:var(--brass-d);font-size:16px}
.acc details[open] summary::after{content:'\2013'}
.acc .body{padding-bottom:20px;font-size:14px;color:var(--soft);max-width:54ch}
.acc .body ul{margin:8px 0 0;padding-left:18px}
.acc .body li{margin-bottom:6px}

/* ---------- cart drawer ---------- */
.overlay{position:fixed;inset:0;background:rgba(28,23,20,.5);z-index:90;animation:fade .22s ease}
@keyframes fade{from{opacity:0}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--cream);z-index:91;display:flex;flex-direction:column;box-shadow:-30px 0 70px -40px rgba(0,0,0,.7);animation:slide .28s cubic-bezier(.2,.8,.3,1)}
@keyframes slide{from{transform:translateX(100%)}}
.drawer>header{display:flex;align-items:center;justify-content:space-between;padding:24px 26px;border-bottom:1px solid var(--line)}
.drawer>header h3{font-size:22px}
.xbtn{background:none;border:0;cursor:pointer;font-size:22px;line-height:1;color:var(--soft);padding:4px 6px}
.drawer .items{flex:1;overflow-y:auto;padding:4px 26px}
.citem{display:grid;grid-template-columns:82px 1fr;gap:16px;padding:20px 0;border-bottom:1px solid var(--line-2)}
.citem .media{border:1px solid var(--line-2)}
.citem .nm{font-family:var(--display);font-weight:600;font-size:16.5px;line-height:1.28}
.citem .mt{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-top:6px;font-weight:500}
.citem .row{display:flex;align-items:center;justify-content:space-between;margin-top:12px;gap:10px}
.citem .qty button{width:30px;height:30px;font-size:14px}
.citem .qty span{width:26px;font-size:12px}
.drawer>footer{border-top:1px solid var(--line);padding:24px 26px;background:var(--paper)}
.sumrow{display:flex;justify-content:space-between;font-size:13.5px;padding:6px 0;color:var(--soft)}
.sumrow.big{font-family:var(--display);font-weight:600;font-size:20px;color:var(--ink);padding-top:14px;margin-top:10px;border-top:1px solid var(--line)}

/* ---------- checkout ---------- */
.steps{display:flex;margin-bottom:48px;flex-wrap:wrap;border-top:1px solid var(--line)}
.steps div{flex:1;min-width:150px;border-top:2px solid transparent;margin-top:-1px;padding:16px 20px 0 0}
.steps div[data-on=true]{border-color:var(--brass)}
.steps .n{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);font-weight:600;display:block}
.steps b{font-size:17px;font-weight:600;font-family:var(--display);display:block;margin-top:4px}
.steps div[data-on=true] .n{color:var(--brass-d)}
.steps p{font-size:12px;color:var(--faint);margin-top:2px}
.cogrid{display:grid;grid-template-columns:1.3fr .7fr;gap:52px;align-items:start;padding-bottom:88px}
.panel{border:1px solid var(--line);background:var(--paper);padding:34px}
.panel h3{font-size:26px;margin-bottom:8px}
.panel .sub{font-size:14px;color:var(--soft);margin-bottom:28px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);font-weight:600}
.field input,.field select{border:0;border-bottom:1px solid var(--line);background:none;padding:9px 0;font-size:15px;width:100%}
.field select{appearance:none;cursor:pointer}
.field textarea{border:1px solid var(--line);padding:11px 13px;background:var(--cream);font-size:15px;width:100%}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--brass)}
.field .err{font-size:11.5px;color:var(--rose)}
.paybox{display:grid;grid-template-columns:auto 1fr;gap:34px;align-items:center;background:var(--espresso);color:#D5C9B9;padding:30px;margin-bottom:26px}
.qr{width:170px;height:170px;background:#fff;padding:10px;flex:none}
.qr svg{width:100%;height:100%;display:block}
.bankrow{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid #3B3229;font-size:14px;flex-wrap:wrap;align-items:baseline}
.bankrow:last-of-type{border-bottom:0}
.bankrow span{color:#8E8274;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:500}
.bankrow b{font-weight:400;color:#F0E6D8;letter-spacing:.04em}
.drop{display:block;border:1px dashed var(--brass);background:var(--brass-wash);padding:36px;text-align:center;cursor:pointer}
.drop input{display:none}
.drop b{font-family:var(--display);font-weight:600;font-size:19px;display:block;margin-bottom:7px}
.drop p{font-size:13px;color:var(--soft)}
.drop.has{border-style:solid;border-color:var(--ok);background:#F1F5F1}
.osum{border:1px solid var(--line);background:var(--paper);padding:28px;position:sticky;top:170px}
.osum h4{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;font-weight:600;padding-bottom:16px;border-bottom:1px solid var(--line);margin:0 0 16px}
.oline{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding:11px 0;font-size:13.5px}
.oline .media{border:1px solid var(--line-2)}
.oline .nm{line-height:1.3;min-width:0}

/* ============================================================
   Artwork — metallic line studies standing in for photography
   ============================================================ */
var GID = 0;
var TONES = {
  t1:['#FCF6EA','#EADCC2','#DCC9A6'],
  t2:['#FBF2EE','#EDD9D1','#E0C6BC'],
  t3:['#F7F6F1','#E4E1D8','#D6D2C6'],
  dark:['#2C2520','#1E1815','#151110']
};

function bez(p0,p1,p2,t){
  var u = 1-t;
  return [u*u*p0[0] + 2*u*t*p1[0] + t*t*p2[0], u*u*p0[1] + 2*u*t*p1[1] + t*t*p2[1]];
}

function art(kind, tone, variant){
  var g = 'g' + (++GID), tn = TONES[tone] || TONES.t1;
  var dark = tone === 'dark';
  var metal = 'url(#m' + g + ')';
  var gem   = 'url(#s' + g + ')';
  var hair  = dark ? '#7A6440' : '#A88A52';

  var defs =
    '<defs>' +
      '<radialGradient id="b' + g + '" cx="34%" cy="22%" r="86%">' +
        '<stop offset="0%" stop-color="' + tn[0] + '"/><stop offset="58%" stop-color="' + tn[1] + '"/><stop offset="100%" stop-color="' + tn[2] + '"/>' +
      '</radialGradient>' +
      '<linearGradient id="m' + g + '" x1="14%" y1="0%" x2="86%" y2="100%">' +
        '<stop offset="0%" stop-color="#F2DCAC"/><stop offset="26%" stop-color="#C9A45F"/>' +
        '<stop offset="58%" stop-color="#8E6E37"/><stop offset="80%" stop-color="#D9BE88"/>' +
        '<stop offset="100%" stop-color="#A98545"/>' +
      '</linearGradient>' +
      '<linearGradient id="s' + g + '" x1="20%" y1="0%" x2="80%" y2="100%">' +
        '<stop offset="0%" stop-color="#FFFFFF" stop-opacity=".95"/>' +
        '<stop offset="45%" stop-color="#EFE3CE"/><stop offset="100%" stop-color="#C2A978"/>' +
      '</linearGradient>' +
    '</defs>';

  var bg = '<rect width="400" height="400" fill="url(#b' + g + ')"/>' +
           '<circle cx="200" cy="196" r="150" fill="none" stroke="' + hair + '" stroke-opacity=".16" stroke-width="1"/>' +
           '<circle cx="200" cy="196" r="128" fill="none" stroke="' + hair + '" stroke-opacity=".10" stroke-width="1"/>';

  var body = '';

  if (kind === 'necklace' || kind === 'set'){
    var P0=[74,118], P1=[200,306], P2=[326,118];
    var chain = '';
    for (var i=1;i<=17;i++){
      var t = i/18, pt = bez(P0,P1,P2,t);
      var r = 3.1 + 4.2*Math.sin(Math.PI*t);
      chain += '<circle cx="' + pt[0].toFixed(1) + '" cy="' + pt[1].toFixed(1) + '" r="' + r.toFixed(1) + '" fill="' + metal + '"/>';
    }
    var cp = bez(P0,P1,P2,0.5);
    body =
      '<path d="M74 118 Q200 306 326 118" fill="none" stroke="' + metal + '" stroke-width="3.2" stroke-linecap="round"/>' +
      '<path d="M88 126 Q200 286 312 126" fill="none" stroke="' + metal + '" stroke-width="1.6" stroke-opacity=".62"/>' +
      chain +
      '<g transform="translate(' + cp[0].toFixed(1) + ',' + (cp[1]+6).toFixed(1) + ')">' +
        '<path d="M0 -4 C 26 10 26 46 0 62 C -26 46 -26 10 0 -4 Z" fill="' + metal + '"/>' +
        '<path d="M0 4 C 16 14 16 40 0 52 C -16 40 -16 14 0 4 Z" fill="' + gem + '"/>' +
        '<path d="M0 4 L0 52 M-15 28 L15 28" stroke="' + hair + '" stroke-opacity=".35" stroke-width="1"/>' +
        '<circle cx="0" cy="-10" r="5" fill="' + metal + '"/>' +
      '</g>';
    if (kind === 'set'){
      body = '<g transform="translate(0,-46) scale(.9)" transform-origin="200 200">' + body + '</g>' +
        '<g transform="translate(-96,168) scale(.34)" transform-origin="200 200">' + jhumka(metal, gem, hair) + '</g>' +
        '<g transform="translate(96,168) scale(.34)" transform-origin="200 200">' + jhumka(metal, gem, hair) + '</g>' +
        '<g transform="translate(0,190) scale(.3)" transform-origin="200 200">' +
          '<path d="M200 150 L232 200 L200 250 L168 200 Z" fill="' + metal + '"/>' +
          '<circle cx="200" cy="200" r="15" fill="' + gem + '"/>' +
        '</g>';
    }
  } else if (kind === 'bangle'){
    var dots = '';
    for (var k=0;k<12;k++){
      var a = (k/12)*Math.PI*2 - Math.PI/2;
      dots += '<circle cx="' + (200+112*Math.cos(a)).toFixed(1) + '" cy="' + (200+112*Math.sin(a)).toFixed(1) + '" r="' + (k%3===0?6.5:4) + '" fill="' + metal + '"/>';
    }
    body =
      '<circle cx="200" cy="200" r="112" fill="none" stroke="' + metal + '" stroke-width="17"/>' +
      '<circle cx="200" cy="200" r="120" fill="none" stroke="' + hair + '" stroke-opacity=".3" stroke-width="1"/>' +
      '<circle cx="200" cy="200" r="104" fill="none" stroke="' + hair + '" stroke-opacity=".3" stroke-width="1"/>' +
      '<path d="M200 88 A112 112 0 0 1 312 200" fill="none" stroke="#FFF3DA" stroke-opacity=".5" stroke-width="4" stroke-linecap="round"/>' +
      dots +
      '<circle cx="200" cy="200" r="76" fill="none" stroke="' + metal + '" stroke-width="5" stroke-opacity=".8"/>' +
      '<circle cx="200" cy="200" r="64" fill="none" stroke="' + metal + '" stroke-width="2.4" stroke-opacity=".55"/>';
  } else if (kind === 'earring'){
    body =
      '<g transform="translate(-56,-14) scale(.84)" transform-origin="200 200">' + jhumka(metal, gem, hair) + '</g>' +
      '<g transform="translate(56,34) scale(.84)" transform-origin="200 200">' + jhumka(metal, gem, hair) + '</g>';
  } else if (kind === 'ring'){
    var pav = '';
    for (var j=0;j<14;j++){
      var aa = Math.PI + (j/13)*Math.PI;
      pav += '<circle cx="' + (200+62*Math.cos(aa)).toFixed(1) + '" cy="' + (252+54*Math.sin(aa)).toFixed(1) + '" r="3.4" fill="' + gem + '"/>';
    }
    body =
      '<ellipse cx="200" cy="252" rx="82" ry="72" fill="none" stroke="' + metal + '" stroke-width="15"/>' +
      '<ellipse cx="200" cy="252" rx="90" ry="80" fill="none" stroke="' + hair + '" stroke-opacity=".28" stroke-width="1"/>' +
      pav +
      '<path d="M158 176 L200 108 L242 176 L200 212 Z" fill="' + metal + '"/>' +
      '<path d="M170 172 L200 124 L230 172 L200 198 Z" fill="' + gem + '"/>' +
      '<path d="M170 172 L230 172 M200 124 L200 198 M170 172 L200 150 L230 172" stroke="' + hair + '" stroke-opacity=".4" stroke-width="1" fill="none"/>' +
      '<circle cx="150" cy="196" r="6" fill="' + metal + '"/><circle cx="250" cy="196" r="6" fill="' + metal + '"/>';
  } else { /* pendant */
    var C0=[92,86], C1=[200,140], C2=[308,86];
    var ch = '';
    for (var m=1;m<=13;m++){
      var tt = m/14, q = bez(C0,C1,C2,tt);
      ch += '<circle cx="' + q[0].toFixed(1) + '" cy="' + q[1].toFixed(1) + '" r="3.2" fill="' + metal + '"/>';
    }
    body = ch +
      '<path d="M92 86 Q200 140 308 86" fill="none" stroke="' + metal + '" stroke-width="1.8" stroke-opacity=".7"/>' +
      '<circle cx="200" cy="152" r="14" fill="none" stroke="' + metal + '" stroke-width="5"/>' +
      '<path d="M200 176 C 250 210 254 268 200 302 C 146 268 150 210 200 176 Z" fill="' + metal + '"/>' +
      '<path d="M200 192 C 236 218 238 260 200 286 C 162 260 164 218 200 192 Z" fill="' + gem + '"/>' +
      '<path d="M200 192 L200 286 M166 240 L234 240 M176 214 L224 266 M224 214 L176 266" stroke="' + hair + '" stroke-opacity=".32" stroke-width="1" fill="none"/>';
  }

  var vt = variant === 1 ? '<g transform="rotate(-12 200 200) scale(1.1)" transform-origin="200 200">'
         : variant === 2 ? '<g transform="scale(.82)" transform-origin="200 200">'
         : '<g>';
  var frame = variant === 2 ? '<rect x="42" y="42" width="316" height="316" fill="none" stroke="' + hair + '" stroke-opacity=".28" stroke-width="1"/>' : '';

  return '<svg viewBox="0 0 400 400" role="img" aria-hidden="true">' + defs + bg + frame + vt + body + '</g></svg>';
}

function jhumka(metal, gem, hair){
  var fr = '';
  for (var i=0;i<9;i++){
    var x = 128 + i*(144/8), y = 230 + 13*Math.sin(Math.PI*i/8);
    fr += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="7" fill="' + metal + '"/>';
  }
  return '<path d="M200 84 C 176 96 172 116 178 132" fill="none" stroke="' + metal + '" stroke-width="3"/>' +
    '<circle cx="200" cy="148" r="20" fill="' + metal + '"/>' +
    '<circle cx="200" cy="148" r="11" fill="' + gem + '"/>' +
    '<path d="M126 228 C 132 168 268 168 274 228 Z" fill="' + metal + '"/>' +
    '<path d="M148 222 C 154 186 246 186 252 222 Z" fill="' + gem + '" fill-opacity=".55"/>' +
    '<path d="M200 174 L200 228 M166 200 L234 200" stroke="' + hair + '" stroke-opacity=".3" stroke-width="1"/>' +
    fr;
}

function qrSVG(){
  var seed = 11, out = '', N = 25;
  function rnd(){ seed = (seed*9301 + 49297) % 233280; return seed/233280; }
  for (var y=0;y<N;y++) for (var x=0;x<N;x++){
    if ((x<7&&y<7)||(x>N-8&&y<7)||(x<7&&y>N-8)) continue;
    if (rnd() > 0.52) out += '<rect x="'+(x*4)+'" y="'+(y*4)+'" width="4" height="4"/>';
  }
  function eye(x,y){ return '<rect x="'+x+'" y="'+y+'" width="28" height="28"/>' +
    '<rect x="'+(x+4)+'" y="'+(y+4)+'" width="20" height="20" fill="#fff"/>' +
    '<rect x="'+(x+8)+'" y="'+(y+8)+'" width="12" height="12"/>'; }
  return '<svg viewBox="0 0 100 100" aria-label="Payment QR code"><g fill="#1C1714">' + out + eye(0,0) + eye(72,0) + eye(0,72) + '</g></svg>';
}

function filtered(){
  var list = DB.products.filter(function(p){
    if (S.catFilter.length && S.catFilter.indexOf(p.cat) < 0) return false;
    if (S.metalFilter.length && S.metalFilter.indexOf(p.metal) < 0) return false;
    if (S.purityFilter.length && S.purityFilter.indexOf(p.purity) < 0) return false;
    if (p.price > S.maxPrice) return false;
    if (S.q){
      var hay = (p.name + ' ' + catName(p.cat) + ' ' + p.metal + ' ' + p.stones).toLowerCase();
      if (hay.indexOf(S.q.toLowerCase()) < 0) return false;
    }
    return true;
  });
  if (S.sort === 'low') list.sort(function(a,b){ return a.price-b.price; });
  else if (S.sort === 'high') list.sort(function(a,b){ return b.price-a.price; });
  else if (S.sort === 'name') list.sort(function(a,b){ return a.name.localeCompare(b.name); });
  else list.sort(function(a,b){ return (b.featured?1:0)-(a.featured?1:0); });
  return list;
}

function render(){
  GID = 0;
  var html;
  if (S.mode === 'admin'){
    document.body.classList.add('adminbody');
    html = '<div class="stack">' + protoBar() + adminHeader() + '</div>';
    if (!S.authed) html += viewLogin();
    else if (S.adminTab === 'orders') html += viewAdminOrders();
    else if (S.adminTab === 'products') html += viewAdminProducts();
    else if (S.adminTab === 'cats') html += viewAdminCats();
    else html += viewDash();
  } else {
    document.body.classList.remove('adminbody');
    html = '<div class="stack">' + protoBar() + header() + '</div>';
    if (S.route === 'shop') html += viewShop();
    else if (S.route === 'product') html += viewProduct();
    else if (S.route === 'bridal') html += viewBridal();
    else if (S.route === 'story') html += viewStory();
    else if (S.route === 'checkout') html += viewCheckout();
    else if (S.route === 'confirm') html += viewConfirm();
    else html += viewHome();
    html += footer();
  }
  el('app').innerHTML = html;
  el('layer').innerHTML = (S.mode === 'store' ? drawer() : '') + (S.modal || '') + guide();
  wireZoom();
  if (S.focusId){
    var f = el(S.focusId);
    if (f){ f.focus(); if (f.setSelectionRange && f.type !== 'range'){ try { var v = f.value.length; f.setSelectionRange(v,v); } catch(e){} } }
    S.focusId = null;
  }
}

function wireZoom(){
  var z = el('zoom');
  if (!z) return;
  z.addEventListener('mousemove', function(e){
    var r = z.getBoundingClientRect(), svg = z.querySelector('svg');
    if (svg) svg.style.transformOrigin = ((e.clientX-r.left)/r.width*100) + '% ' + ((e.clientY-r.top)/r.height*100) + '%';
  });
  z.addEventListener('mouseenter', function(){ z.classList.add('on'); });
  z.addEventListener('mouseleave', function(){ z.classList.remove('on'); });
  z.addEventListener('click', function(){ z.classList.toggle('on'); });
}

function addToCart(pid, qty){
  var line = null;
  for (var i=0;i<S.cart.length;i++) if (S.cart[i].pid === pid) line = S.cart[i];
  if (line) line.qty += qty; else S.cart.push({ pid:pid, qty:qty });
}

function validateDetails(){
  S.formErr = {};
  var need = { name:'Please enter a name', phone:'We need a number to confirm on WhatsApp',
               addr:'Please enter the address', city:'Please enter the city', pin:'Please enter the PIN code' };
  for (var k in need) if (!String(S.form[k]||'').trim()) S.formErr[k] = need[k];
  if (S.form.pin && !/^\d{6}$/.test(String(S.form.pin).trim())) S.formErr.pin = 'A PIN code is six digits';
  if (S.form.phone && String(S.form.phone).replace(/\D/g,'').length < 10) S.formErr.phone = 'Enter a ten-digit mobile number';
  for (var e in S.formErr) return false;
  return true;
}

function placeOrder(){
  var o = {
    id: 'BJS-' + (24820 + (DB.orders.length - 3)),
    name: S.form.name || 'Guest', phone: S.form.phone || '', city: S.form.city || '',
    items: S.cart.map(function(c){ return { pid:c.pid, qty:c.qty }; }),
    status: 'pending', proof: S.proofName || 'receipt.jpg',
    placed: '30 Sep 2026, ' + new Date().toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'}),
    method: 'UPI'
  };
  DB.orders.push(o);
  S.cart.forEach(function(c){ var p = prod(c.pid); if (p) p.stock = Math.max(0, p.stock - c.qty); });
  S.order = o; S.cart = []; S.proofName = ''; S.coStep = 1; S.form = {}; S.formErr = {};
  go('confirm');
}

function readForm(ids){ var o = {}; ids.forEach(function(id){ var e = el(id); if (e) o[id] = e.value; }); return o; }

function saveProduct(target){
  var f = readForm(['m_name','m_cat','m_price','m_purity','m_metal','m_weight','m_stock','m_stones','m_motif','m_tone','m_desc']);
  if (!f.m_name.trim()){ toast('Give the piece a name first'); return; }
  var data = {
    name: f.m_name.trim(), cat: f.m_cat, price: Math.max(0, parseInt(f.m_price,10) || 0),
    purity: f.m_purity, metal: f.m_metal, weight: f.m_weight.trim() || '—',
    stock: Math.max(0, parseInt(f.m_stock,10) || 0), stones: f.m_stones.trim() || 'None',
    motif: f.m_motif, tone: f.m_tone,
    desc: f.m_desc.trim() || 'Hand-finished in the BJS workshop, hallmarked and weighed before dispatch.'
  };
  if (target === 'new'){ data.id = 'p' + (Date.now()%100000); DB.products.push(data); toast(data.name + ' is live on the storefront'); }
  else { var p = prod(target); if (p) for (var k in data) p[k] = data[k]; toast('Saved. The storefront is updated.'); }
  S.modal = null; render();
}

function saveCat(target){
  var f = readForm(['c_name','c_blurb','c_motif']);
  if (!f.c_name.trim()){ toast('Give the category a name first'); return; }
  var slug = f.c_name.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  if (target === 'new'){
    DB.cats.push({ id:'c'+(Date.now()%100000), name:f.c_name.trim(), slug:slug, blurb:f.c_blurb.trim(), motif:f.c_motif });
    toast('Category added to the storefront');
  } else {
    var c = byId(DB.cats, target);
    if (c){ c.name = f.c_name.trim(); c.slug = slug; c.blurb = f.c_blurb.trim(); c.motif = f.c_motif; }
    toast('Category saved');
  }
  S.modal = null; render();
}

document.addEventListener('click', function(ev){
  var t = ev.target.closest('[data-nav],[data-mode],[data-p],[data-cat],[data-act],[data-q],[data-add],[data-thumb],[data-cq],[data-rmcart],[data-rm],[data-tab],[data-edit],[data-del],[data-ecat],[data-dcat],[data-proof],[data-save-product],[data-save-cat],[data-confirmpay],[data-doconfirm],[data-guide]');
  if (!t) return;
  var d = t.dataset;

  if (d.nav){ go(d.nav); return; }
  if (d.mode){ S.mode = d.mode; S.modal = null; S.drawer = false; render(); window.scrollTo({top:0}); return; }
  if (d.guide){ S.mode = 'store'; S.guide = false; go(d.guide); return; }
  if (d.p){ go('product', { pid:d.p }); return; }
  if (d.cat){ S.mode='store'; S.catFilter=[d.cat]; S.metalFilter=[]; S.purityFilter=[]; S.q=''; go('shop'); return; }
  if (d.thumb !== undefined){ S.thumb = parseInt(d.thumb,10); render(); return; }
  if (d.add){
    var qn = el('pq'), n = qn ? parseInt(qn.textContent,10) : 1;
    addToCart(d.add, n); S.drawer = true; render(); toast('Added to your cart'); return;
  }
  if (d.q){ var cur = el('pq'); if (cur) cur.textContent = Math.max(1, parseInt(cur.textContent,10) + parseInt(d.q,10)); return; }
  if (d.cq){
    var parts = d.cq.split('|'), line = S.cart.filter(function(c){ return c.pid === parts[0]; })[0];
    if (line){ line.qty += parseInt(parts[1],10); if (line.qty < 1) S.cart = S.cart.filter(function(c){ return c.pid !== parts[0]; }); }
    render(); return;
  }
  if (d.rmcart){ S.cart = S.cart.filter(function(c){ return c.pid !== d.rmcart; }); render(); return; }
  if (d.rm){
    var kind = d.rm.split(':')[0], val = d.rm.slice(kind.length+1);
    if (kind==='cat') S.catFilter = S.catFilter.filter(function(x){ return x!==val; });
    else if (kind==='metal') S.metalFilter = S.metalFilter.filter(function(x){ return x!==val; });
    else if (kind==='purity') S.purityFilter = S.purityFilter.filter(function(x){ return x!==val; });
    else if (kind==='q') S.q = '';
    else if (kind==='price') S.maxPrice = 900000;
    else { S.catFilter=[]; S.metalFilter=[]; S.purityFilter=[]; S.q=''; S.maxPrice=900000; }
    render(); return;
  }
  if (d.tab){ S.adminTab = d.tab; S.modal = null; render(); window.scrollTo({top:0}); return; }
  if (d.edit){ S.modal = modalProduct(prod(d.edit)); render(); return; }
  if (d.del){
    var dp = prod(d.del);
    S.modal = modalConfirm({ title:'Delete this piece?', cta:'Delete', act:'delp:'+d.del,
      body:'<b>' + esc(dp?dp.name:'') + '</b> will be removed from the storefront straight away. Past orders keep their record.' });
    render(); return;
  }
  if (d.ecat){ S.modal = modalCat(byId(DB.cats, d.ecat)); render(); return; }
  if (d.dcat){
    var dc = byId(DB.cats, d.dcat), cn = DB.products.filter(function(p){ return p.cat === d.dcat; }).length;
    S.modal = modalConfirm({ title:'Delete this category?', cta:'Delete', act:'delc:'+d.dcat,
      body:'<b>' + esc(dc?dc.name:'') + '</b> will be removed.' + (cn ? ' Its ' + cn + ' piece' + (cn>1?'s':'') + ' stay in the catalogue but show as uncategorised until you move them.' : '') });
    render(); return;
  }
  if (d.doconfirm){
    var kk = d.doconfirm.split(':')[0], ii = d.doconfirm.split(':')[1];
    if (kk === 'delp'){ DB.products = DB.products.filter(function(p){ return p.id !== ii; }); toast('Removed from the storefront'); }
    else { DB.cats = DB.cats.filter(function(c){ return c.id !== ii; }); toast('Category removed'); }
    S.modal = null; render(); return;
  }
  if (d.proof){ var po = null; DB.orders.forEach(function(o){ if (o.id === d.proof) po = o; }); if (po){ S.modal = modalProof(po); render(); } return; }
  if (d.confirmpay){
    DB.orders.forEach(function(o){ if (o.id === d.confirmpay && o.status === 'pending') o.status = 'confirmed'; });
    S.modal = null; render(); toast('Payment confirmed'); return;
  }
  if (d.saveProduct){ saveProduct(d.saveProduct); return; }
  if (d.saveCat){ saveCat(d.saveCat); return; }

  switch (d.act){
    case 'cart': S.drawer = true; render(); break;
    case 'close': S.drawer = false; render(); break;
    case 'close-modal': S.modal = null; render(); break;
    case 'mobnav': S.mobileNav = !S.mobileNav; render(); break;
    case 'guide': S.guide = !S.guide; render(); break;
    case 'focus-search': S.focusId = 'q'; if (S.route !== 'shop') go('shop'); else render(); break;
    case 'checkout': S.drawer = false; go('checkout'); break;
    case 'co-next':
      if (S.coStep === 1 && !validateDetails()){ render(); toast('A few details are still missing'); break; }
      S.coStep = Math.min(3, S.coStep+1); render(); window.scrollTo({top:0}); break;
    case 'co-back': S.coStep = Math.max(1, S.coStep-1); render(); window.scrollTo({top:0}); break;
    case 'place': placeOrder(); break;
    case 'copy-upi':
      try { navigator.clipboard.writeText('bjsjewellers@okhdfcbank').then(
        function(){ toast('UPI ID copied'); }, function(){ toast('UPI ID: bjsjewellers@okhdfcbank'); }); }
      catch(e){ toast('UPI ID: bjsjewellers@okhdfcbank'); }
      break;
    case 'enquire': toast('WhatsApp the shop on +91 98765 43210'); break;
    case 'policy': toast('Policy pages are part of the build, not the prototype'); break;
    case 'login': S.authed = true; S.adminTab = 'dash'; render(); toast('Signed in to the portal'); break;
    case 'logout': S.authed = false; render(); break;
    case 'new-product': S.modal = modalProduct(null); render(); break;
    case 'new-cat': S.modal = modalCat(null); render(); break;
  }
});

document.addEventListener('change', function(ev){
  var t = ev.target;
  if (t.id === 'sort'){ S.sort = t.value; render(); return; }
  if (t.dataset && t.dataset.ostatus){
    DB.orders.forEach(function(o){ if (o.id === t.dataset.ostatus) o.status = t.value; });
    render(); toast(t.dataset.ostatus + ' moved to “' + statusMeta(t.value).label + '”'); return;
  }
  if (t.dataset && t.dataset.f){
    var arr = t.dataset.f === 'cat' ? S.catFilter : (t.dataset.f === 'metal' ? S.metalFilter : S.purityFilter);
    var i = arr.indexOf(t.value);
    if (t.checked && i < 0) arr.push(t.value);
    if (!t.checked && i >= 0) arr.splice(i,1);
    render(); return;
  }
  if (t.id === 'proof'){ S.proofName = (t.files && t.files[0]) ? t.files[0].name : 'receipt.jpg'; render(); toast('Receipt attached'); return; }
});

var qTimer = null;
document.addEventListener('input', function(ev){
  var t = ev.target;
  if (t.id === 'q'){ S.q = t.value; clearTimeout(qTimer);
    qTimer = setTimeout(function(){ S.focusId = 'q'; render(); }, 220); return; }
  if (t.id === 'price'){ S.maxPrice = parseInt(t.value,10); S.focusId = 'price'; render(); return; }
  if (t.dataset && t.dataset.form){ S.form[t.dataset.form] = t.value; return; }
});

document.addEventListener('keydown', function(ev){
  if (ev.key !== 'Escape') return;
  if (S.modal){ S.modal = null; render(); }
  else if (S.drawer){ S.drawer = false; render(); }
  else if (S.guide){ S.guide = false; render(); }
});

render();
setTimeout(function(){ if (!S.guide && !S.guideSeen){ S.guide = true; S.guideSeen = true; render(); } }, 1600);
})();
</script>
